[package]
name = "nv-sane-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raw FFI bindings for libsane (generated by bindgen)"
build = "build.rs"

[build-dependencies]
bindgen = { version = "0.70", optional = true }

[features]
# When enabled, regenerate bindings from installed sane headers.
regenerate-bindings = ["bindgen"]
