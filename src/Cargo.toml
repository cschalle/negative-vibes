[package]
name = "negative-vibes"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "negative-vibes"
path = "main.rs"

[dependencies]
glib.workspace = true
gio.workspace = true
gtk.workspace = true
adw.workspace = true
nv-acquire = { path = "../crates/nv-acquire" }
nv-device  = { path = "../crates/nv-device" }
nv-image   = { path = "../crates/nv-image" }
nv-store   = { path = "../crates/nv-store" }
nv-film    = { path = "../crates/nv-film" }
nv-process = { path = "../crates/nv-process" }
nv-export  = { path = "../crates/nv-export" }
nv-calibrate = { path = "../crates/nv-calibrate" }
nv-gphotos = { path = "../crates/nv-gphotos" }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
async-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
