name: Flatpak

# Builds the Flatpak whenever the program changes. Documentation, screenshots and the licence
# are ignored, so editing them does not rebuild or republish anything. (help/ is the manual
# that ships inside the app, so it does count as a change.)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.cschalle.NegativeVibes

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Google asks for the secret of an installed app all the same, and the git-ignored
      # build-aux/google-client.env that carries it locally is not in a checkout. The
      # build reads it from there. Pull requests from forks get no secrets: their build
      # has no Google sign-in.
      - name: Give the build the Google client secret
        env:
          NV_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE }}
        run: |
          if [ -n "$NV_GOOGLE_CLIENT_SECRET" ]; then
            printf 'NV_GOOGLE_CLIENT_SECRET=%s\n' "$NV_GOOGLE_CLIENT_SECRET" > build-aux/google-client.env
          else
            echo "::warning::NV_GOOGLE_CLIENT_SECRET is not set; this build cannot sign in to Google Photos"
          fi

      # The version in the repository is the release (0.1.0); a CI build adds which build it is,
      # as semver build metadata (0.1.0+57.4c9ed76), so an installed copy can be told from the
      # one before it. It shows in About and as the Flatpak's version, and the checkout is
      # only the build's, so nothing is committed.
      - name: Stamp the build number into the version
        run: |
          base=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          version="${base}+${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          sed -i "0,/^version = \"${base}\"$/s//version = \"${version}\"/" Cargo.toml
          sed -i "0,/version: '${base}',/s//version: '${version}',/" meson.build
          sed -i "0,/<release version=\"${base}\"/s//<release version=\"${version}\"/" data/io.github.cschalle.NegativeVibes.metainfo.xml.in
          grep -n "${version}" Cargo.toml meson.build data/io.github.cschalle.NegativeVibes.metainfo.xml.in
          echo "Version is now ${version}"

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: negative-vibes.flatpak
          manifest-path: build-aux/io.github.cschalle.NegativeVibes.json
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache: true
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: negative-vibes-flatpak
          path: negative-vibes.flatpak
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    # Pull requests build only; main publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: negative-vibes-flatpak

      # A rolling "latest" release holds the installable bundle. It is not marked a
      # prerelease, so GitHub calls it the repository's Latest release: it takes the green
      # badge, /releases/latest resolves to it and the sidebar on the front page shows it.
      # The cost of that is the tag moving on every push, which the notes say outright.
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest negative-vibes.flatpak --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). This release rolls: every build of \`main\` replaces it, so the download is always the newest code and is not a fixed version.

          \`\`\`sh
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user negative-vibes.flatpak
          \`\`\`"
